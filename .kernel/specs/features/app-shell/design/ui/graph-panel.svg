    <text x="996" y="100" font-size="11" fill="#777" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">Kind</text>
  <text id="field-kind" x="996" y="118" font-size="13" fill="#222" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">function</text>
  <text x="996" y="150" font-size="11" fill="#777" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">Name</text>
  <text id="field-name" x="996" y="168" font-size="13" fill="#222" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">parseConfig</text>
  <text x="996" y="200" font-size="11" fill="#777" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">Location</text>
  <text id="field-location" x="996" y="218" font-size="13" fill="#222" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">src/config.go:12</text>
  <rect id="btn-open-in-editor" x="996" y="244" width="120" height="26" fill="#fff" stroke="#666"/>
  <text x="1056" y="261" font-size="12" text-anchor="middle" fill="#333" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">Open in editor</text>
  <!-- main region: owned by code-graph; placeholder nodes -->
  <rect id="region-main" x="0" y="36" width="980" height="764" fill="#fff" stroke="none"/>
  <text x="12" y="56" font-size="10" fill="#aaa" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">main region — canvas owned by code-graph</text>
  <line x1="300" y1="300" x2="500" y2="420" stroke="#999"/>
  <line x1="500" y1="420" x2="700" y2="300" stroke="#999"/>
  <line x1="500" y1="420" x2="520" y2="600" stroke="#999"/>
  <rect x="230" y="280" width="140" height="40" rx="6" fill="#fff" stroke="#888"/>
