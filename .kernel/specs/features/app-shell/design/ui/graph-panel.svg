<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800">
<title>Graph panel — populated, node parseConfig selected</title>
  <rect x="0" y="0" width="1280" height="800" fill="#fafafa" stroke="#999"/>
