<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800">
<title>Graph panel — failed</title>
  <rect x="0" y="0" width="1280" height="800" fill="#fafafa" stroke="#999"/>
  <!-- toolbar -->
  <rect id="region-toolbar" x="0" y="0" width="1280" height="36" fill="#eee" stroke="#bbb"/>
  <text x="12" y="23" font-size="13" font-weight="bold" fill="#333" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">Code Matrix</text>
  <text id="text-sidecar-state" x="110" y="23" font-size="12" fill="#666" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">failed</text>
  <rect id="btn-details-toggle" x="846" y="7" width="70" height="22" fill="#fff" stroke="#999"/>
  <text x="881" y="22" font-size="12" text-anchor="middle" fill="#333" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">Details</text>
  <rect id="btn-restart-server" x="1030" y="7" width="110" height="22" fill="#fff" stroke="#999"/>
  <text x="1085" y="22" font-size="12" text-anchor="middle" fill="#333" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">Restart Server</text>
  <rect id="btn-show-log" x="1150" y="7" width="110" height="22" fill="#fff" stroke="#999"/>
  <text x="1205" y="22" font-size="12" text-anchor="middle" fill="#333" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">Show Log</text>
  <!-- details region -->
  <rect id="region-details" x="980" y="36" width="300" height="764" fill="#f3f3f3" stroke="#bbb"/>
  <text x="996" y="62" font-size="12" font-weight="bold" fill="#555" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">DETAILS</text>
  
  <rect id="region-main" x="0" y="36" width="980" height="764" fill="#fff"/>
  <rect id="overlay-failed" x="290" y="300" width="400" height="190" fill="#f7f7f7" stroke="#777"/>
  <text id="text-failed-heading" x="490" y="340" font-size="16" font-weight="bold" text-anchor="middle" fill="#333" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">Code Matrix server failed</text>
  <text id="text-failed-cause" x="490" y="372" font-size="12" text-anchor="middle" fill="#555" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">Server binary not found for darwin-arm64: …/bin/code-matrix-server</text>
  <rect id="btn-retry" x="350" y="420" width="120" height="30" fill="#fff" stroke="#333"/>
  <text x="410" y="440" font-size="13" text-anchor="middle" fill="#222" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">Retry</text>
  <rect id="btn-show-log-overlay" x="510" y="420" width="120" height="30" fill="#fff" stroke="#999"/>
  <text x="570" y="440" font-size="13" text-anchor="middle" fill="#333" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">Show Log</text>
</svg>
