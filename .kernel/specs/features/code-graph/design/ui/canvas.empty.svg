<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800">
<title>Canvas — empty, no supported source files</title>
  <rect x="0" y="0" width="1280" height="800" fill="#fafafa" stroke="#999"/>
  <rect id="region-toolbar" x="0" y="0" width="1280" height="36" fill="#eee" stroke="#bbb"/>
  <text x="12" y="23" font-size="13" font-weight="bold" fill="#333" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">Code Matrix</text>
  <text x="110" y="23" font-size="12" fill="#666" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">ready</text>
  <!-- code-graph toolbar controls (middle slot) -->
  <rect id="field-search" x="170" y="7" width="150" height="22" fill="#fff" stroke="#999"/>
  <text x="178" y="22" font-size="12" fill="#999" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">Search nodes</text>
  <rect id="field-path" x="330" y="7" width="190" height="22" fill="#fff" stroke="#999"/>
  <text x="338" y="22" font-size="12" fill="#999" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">Path filter, e.g. src/api/**</text>
  <rect id="btn-kinds" x="530" y="7" width="60" height="22" fill="#fff" stroke="#999"/>
  <text x="560" y="22" font-size="12" text-anchor="middle" fill="#333" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">Kinds</text>
  <rect id="btn-focus" x="600" y="7" width="60" height="22" fill="#fff" stroke="#999"/>
  <text x="630" y="22" font-size="12" text-anchor="middle" fill="#333" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">Focus</text>
  <text x="670" y="22" font-size="12" fill="#999" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">Hops</text>
  <rect id="field-hops" x="702" y="7" width="40" height="22" fill="#f5f5f5" stroke="#ccc"/>
  <text x="722" y="22" font-size="12" text-anchor="middle" fill="#aaa" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">1</text>
  <text id="text-counts" x="760" y="22" font-size="12" fill="#666" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">0 nodes · 0 edges</text>
  <rect x="846" y="7" width="70" height="22" fill="#fff" stroke="#999"/>
  <text x="881" y="22" font-size="12" text-anchor="middle" fill="#333" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">Details</text>
  <rect x="1030" y="7" width="110" height="22" fill="#fff" stroke="#999"/>
  <text x="1085" y="22" font-size="12" text-anchor="middle" fill="#333" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">Restart Server</text>
  <rect x="1150" y="7" width="110" height="22" fill="#fff" stroke="#999"/>
  <text x="1205" y="22" font-size="12" text-anchor="middle" fill="#333" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">Show Log</text>
  <rect id="region-details" x="980" y="36" width="300" height="764" fill="#f3f3f3" stroke="#bbb"/>
  <text x="996" y="62" font-size="12" font-weight="bold" fill="#555" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">DETAILS</text>
  <rect id="region-main" x="0" y="36" width="980" height="764" fill="#fff"/>
  <text x="996" y="100" font-size="12" fill="#888" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">Select a node to see its details</text>
  <text id="text-empty" x="490" y="420" font-size="16" text-anchor="middle" fill="#666" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">No supported source files found</text>
